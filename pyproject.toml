[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grazpedwri-faster-rcnn"
version = "0.1.0"
description = "Pediatric Wrist Fracture Detection on X-ray Images Using Faster R-CNN"
authors = [
    { name = "Computer Vision & Medical Imaging Team" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.7.0",
    "pillow>=9.5.0",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "albumentations>=1.3.0",
    "torchmetrics>=1.0.0",
    "matplotlib>=3.7.0",
    "tensorboard>=2.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "flake8>=6.0.0",
    "black>=23.3.0",
    "isort>=5.12.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
